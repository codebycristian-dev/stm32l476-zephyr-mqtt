# Keep diagnostics on the board-defined USART2/ST-LINK console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Diagnostic status and the direct evidence writer share USART2. Immediate mode
# prevents a deferred log worker from interleaving with the evidence record.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_GPIO=y

# The synchronous evidence path runs on the main thread. Target disassembly
# bounds its application frames, but Zephyr printk adds formatter depth; 1536
# leaves measured fault-relative headroom without enlarging evidence storage.
CONFIG_MAIN_STACK_SIZE=1536

# USART1 is owned exclusively by the direct-CMSIS transport. USART2 remains
# Zephyr's board-defined ST-LINK console.
CONFIG_APP_USART1_LOOPBACK=n
CONFIG_APP_ESPAT_AT_DIAGNOSTIC=y
